name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Fetch Ötzi at the recorded commit
        run: |
          SHA="$(cat src/otzi/OTZI_COMMIT)"
          git init otzi-ref
          git -C otzi-ref fetch --depth 1 https://github.com/mwaddip/otzi "$SHA"
          git -C otzi-ref checkout FETCH_HEAD

      - name: Check src/otzi against Ötzi (drift)
        run: bash scripts/check-otzi-drift.sh otzi-ref
