# /etc/fail2ban/filter.d/otzi.conf
#
# fail2ban filter for the otzi-headless peer-mesh IP allowlist warn-log.
#
# When a peer-mesh daemon receives an inbound WebSocket connection from a
# source IP not on the resolved peer-endpoint allowlist, it black-hole drops
# the socket and emits a warn-level log line of the form:
#
#   peer-allowlist: dropped connection from non-peer source <extras>
#
# where `<extras>` carries the offending `ip` + `port` as structured fields.
# The exact rendering depends on the daemon's logger backend (see the README's
# "Logger gotcha" section). This regex matches the message prefix and uses
# fail2ban's <HOST> token to capture the IP from the structured tail in the
# two formats the daemon may emit:
#
#   1. JSON-extras renderer (recommended for journald):
#        peer-allowlist: dropped connection from non-peer source {"ip":"1.2.3.4","port":56789}
#
#   2. Node `util.inspect` renderer (default for `console.warn(msg, obj)`):
#        peer-allowlist: dropped connection from non-peer source { ip: '1.2.3.4', port: 56789 }
#
# IPv6 addresses (and v4-mapped-in-v6 like `::ffff:1.2.3.4`) are handled by
# fail2ban's `<HOST>` token. Both unquoted and quoted IPs are accepted.

[Definition]
failregex = ^.*peer-allowlist: dropped connection from non-peer source\s*[\{].*?ip["']?\s*[:=]\s*["']?<HOST>["']?.*$
ignoreregex =

# Notes
# -----
# - `<HOST>` is fail2ban's portable IP capture; expands to a regex that matches
#   IPv4 (dotted-quad) and IPv6 (full + abbreviated forms).
# - Test against your live daemon with:
#     fail2ban-regex --journalmatch '_SYSTEMD_UNIT=otzi.service' \
#         systemd-journal /etc/fail2ban/filter.d/otzi.conf
#   (drops in the last hour show as "matched lines" in the output).
