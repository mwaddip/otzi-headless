# /etc/fail2ban/filter.d/otzi.conf
#
# fail2ban filter for the otzi-headless peer-mesh IP allowlist warn-log.
#
# When a peer-mesh daemon receives an inbound WebSocket connection from a
# source IP not on the resolved peer-endpoint allowlist, it black-hole drops
# the socket and its logger (src/daemon/console-logger.ts) writes one warn line:
#
#   WARN peer-allowlist: dropped connection from non-peer source {"ip":"1.2.3.4","port":56789}
#
# journald stores it as the entry's MESSAGE, and fail2ban's systemd backend
# hands the filter `<host> <ident>[<pid>]: <MESSAGE>`.
#
# The regex is anchored to the start of the logger's line (after that optional
# prefix). Other log lines carry text from peers, but the logger escapes every
# control character, so peer text can never begin a line of its own: anchored,
# the filter cannot be made to ban an honest peer by a forged message.
#
# IPv6 addresses (and v4-mapped-in-v6 like `::ffff:1.2.3.4`) are handled by
# fail2ban's `<HOST>` token.

[Definition]
failregex = ^(?:\S+\s+)?(?:\S+\[\d+\]:\s+)?WARN peer-allowlist: dropped connection from non-peer source \{"ip":"<HOST>"
ignoreregex =

# Notes
# -----
# - `<HOST>` is fail2ban's portable IP capture; expands to a regex that matches
#   IPv4 (dotted-quad) and IPv6 (full + abbreviated forms).
# - Test against your live daemon with:
#     fail2ban-regex --journalmatch '_SYSTEMD_UNIT=otzi.service' \
#         systemd-journal /etc/fail2ban/filter.d/otzi.conf
#   (drops in the last hour show as "matched lines" in the output).
